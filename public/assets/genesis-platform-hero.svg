<svg viewBox="0 0 760 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cyan & Blue Ambient Glows -->
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#0066ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pedestalRim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#0044cc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#040814" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="emblemFacetTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="emblemFacetLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e294b"/>
      <stop offset="100%" stop-color="#070b16"/>
    </linearGradient>
    <linearGradient id="emblemFacetRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e3d6b"/>
      <stop offset="100%" stop-color="#0f162c"/>
    </linearGradient>
    <linearGradient id="trailGrad" x1="0" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#8b44ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0070ba" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background Ambient Depth -->
  <circle cx="380" cy="220" r="260" fill="url(#haloGlow)"/>

  <!-- Large Illuminated Neon Halo Ring behind Stage (matches 01-entry-home.png) -->
  <ellipse cx="380" cy="210" rx="250" ry="210" stroke="#00f0ff" stroke-width="2.5" stroke-opacity="0.85" fill="none"/>
  <ellipse cx="380" cy="210" rx="250" ry="210" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.2" fill="none"/>

  <!-- Circular Illuminated Stage / Pedestal (matches 01-entry-home.png) -->
  <!-- Base Shadow -->
  <ellipse cx="380" cy="370" rx="310" ry="80" fill="#020409"/>
  <!-- Outer Rim Ring -->
  <ellipse cx="380" cy="350" rx="290" ry="70" fill="#091124" stroke="#00d4ff" stroke-width="3"/>
  <ellipse cx="380" cy="350" rx="290" ry="70" stroke="#00f0ff" stroke-width="12" stroke-opacity="0.35" fill="none"/>
  <!-- Inner Stage Surface -->
  <ellipse cx="380" cy="346" rx="260" ry="60" fill="#050a17" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- DELICATE CURVED LIGHT TRAILS (Idea -> Intelligence -> Emblem -> Manufacturing -> PayPal) -->
  <path d="M140 310 C160 170, 260 90, 380 90 C500 90, 600 170, 620 310" stroke="url(#trailGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M140 310 C220 380, 540 380, 620 310" stroke="url(#trailGrad)" stroke-width="2" fill="none" stroke-dasharray="6 8" opacity="0.6"/>
  <path d="M220 220 C290 280, 470 280, 540 220" stroke="#00f0ff" stroke-width="1.5" fill="none" stroke-opacity="0.7"/>

  <!-- 1. CENTER: LUMINOUS SCULPTURAL GENESIS EMBLEM -->
  <g transform="translate(380, 270)">
    <!-- Outer Specular Halo -->
    <circle cx="0" cy="0" r="85" fill="rgba(0,112,186,0.3)"/>
    <!-- Faceted Isometric Crystal Monolith -->
    <!-- Top Apex -->
    <polygon points="0,-85 65,-45 0,-5 -65,-45" fill="url(#emblemFacetTop)" stroke="#93c5fd" stroke-width="1.5"/>
    <!-- Left Facet -->
    <polygon points="-65,-45 0,-5 0,65 -65,25" fill="url(#emblemFacetLeft)" stroke="#3b82f6" stroke-width="1.2"/>
    <!-- Right Facet -->
    <polygon points="0,-5 65,-45 65,25 0,65" fill="url(#emblemFacetRight)" stroke="#60a5fa" stroke-width="1.2"/>
    <!-- Embossed PayPal P + G Monogram (Center) -->
    <g transform="translate(-14, -28) scale(1.1)">
      <path d="M4 0 L14 0 C19 0, 22 2.5, 22 6 C22 9.5, 19 12, 14 12 L9 12 L7 22 L3 22 L4 0 Z" fill="#003087" opacity="0.95"/>
      <path d="M8 3 L18 3 C22 3, 25 5.5, 25 9 C25 12.5, 22 15, 17 15 L12 15 L10 25 L6 25 L8 3 Z" fill="#00d4ff"/>
      <circle cx="17" cy="9" r="3" fill="#ffffff"/>
    </g>
    <text x="0" y="92" text-anchor="middle" fill="#f1f5f9" font-family="system-ui" font-size="13" font-weight="800" letter-spacing="2">GENESIS PRODUCT OS</text>
  </g>

  <!-- 2. FLOATING NODE: IDEA (Left: x=140, y=310) -->
  <g transform="translate(140, 310)">
    <circle cx="0" cy="0" r="38" fill="#070d1e" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="0" r="44" stroke="#00f0ff" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
    <!-- Incandescent Lightbulb / Spark Core -->
    <path d="M-10 -7 C-10 -15, 10 -15, 10 -7 C10 -1, 5 3, 5 8 L-5 8 C-5 3, -10 -1, -10 -7 Z" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <line x1="-4" y1="12" x2="4" y2="12" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="-7" r="4" fill="#fef08a"/>
    <text x="0" y="58" text-anchor="middle" fill="#93c5fd" font-family="system-ui" font-size="11" font-weight="800" letter-spacing="1">IDEA</text>
  </g>

  <!-- 3. FLOATING NODE: AI INTELLIGENCE / GEMINI SPEC (Top Apex: x=380, y=85) -->
  <g transform="translate(380, 85)">
    <!-- Isometric Holographic Sheet -->
    <polygon points="-50,-25 50,-25 65,25 -35,25" fill="rgba(15,23,42,0.85)" stroke="#818cf8" stroke-width="1.8"/>
    <!-- Gemini 4-Point Star Core -->
    <path d="M 10 0 Q 10 -14, 20 -14 Q 20 0, 34 0 Q 20 0, 20 14 Q 20 0, 10 0 Z" fill="#ffffff" transform="translate(-7, 0)"/>
    <!-- Schematic lines -->
    <line x1="-30" y1="-10" x2="-5" y2="-10" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="-30" y1="-2" x2="-10" y2="-2" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="-30" y1="6" x2="-15" y2="6" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="15" y="46" text-anchor="middle" fill="#c7d2fe" font-family="system-ui" font-size="11" font-weight="800" letter-spacing="1">AI SPEC</text>
  </g>

  <!-- 4. FLOATING NODE: MANUFACTURING OBJECT (Right: x=620, y=310) -->
  <g transform="translate(620, 310)">
    <circle cx="0" cy="0" r="38" fill="#070d1e" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="0" r="44" stroke="#00f0ff" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
    <!-- Precision Machined Hardware Chassis -->
    <rect x="-18" y="-14" width="36" height="28" rx="4" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="-7" cy="3" r="3.5" fill="#00f0ff"/>
    <circle cx="7" cy="3" r="3.5" fill="#00f0ff"/>
    <rect x="-14" y="-9" width="28" height="6" rx="2" fill="#090d16"/>
    <text x="0" y="58" text-anchor="middle" fill="#7dd3fc" font-family="system-ui" font-size="11" font-weight="800" letter-spacing="1">BUILD</text>
  </g>

  <!-- 5. FLOATING NODE: PAYPAL ESCROW (Front-Right: x=510, y=390) -->
  <g transform="translate(510, 390)">
    <!-- Sapphire Glow Medallion -->
    <ellipse cx="0" cy="0" rx="36" ry="28" fill="#003087" stroke="#0070ba" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="30" ry="22" fill="#001c4d" stroke="#00f0ff" stroke-width="1.2"/>
    <!-- PayPal Monogram & Checkmark -->
    <g transform="translate(-6, -10) scale(0.85)">
      <path d="M2 0 L10 0 C14 0, 16 2, 16 5 C16 8, 14 10, 10 10 L7 10 L5 18 L2 18 L2 0 Z" fill="#ffffff"/>
    </g>
    <circle cx="14" cy="2" r="7" fill="#10b981" stroke="#ffffff" stroke-width="1"/>
    <path d="M11 2 L13 4 L17 0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="0" y="42" text-anchor="middle" fill="#60a5fa" font-family="system-ui" font-size="10.5" font-weight="800" letter-spacing="0.8">PAYPAL</text>
  </g>
</svg>