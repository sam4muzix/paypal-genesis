<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="screenBezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18233c"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="displayGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0044aa"/>
      <stop offset="100%" stop-color="#001133"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="245" rx="160" ry="35" fill="rgba(0,180,255,0.18)"/>
  <!-- Display Lid (Tilted) -->
  <polygon points="90,70 310,70 325,190 75,190" fill="url(#screenBezel)" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="102,80 298,80 312,182 88,182" fill="url(#displayGrad)"/>
  <!-- Logo on screen -->
  <circle cx="200" cy="130" r="16" fill="#00f0ff" opacity="0.8"/>
  <!-- Base Keyboard Chassis -->
  <polygon points="75,190 325,190 360,235 40,235" fill="#1e2948" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Trackpad -->
  <polygon points="165,212 235,212 242,230 158,230" fill="#131c33" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="200" y="275" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11" letter-spacing="1.5">NEURAL WORKSTATION PRO</text>
</svg>