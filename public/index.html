<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PayPal GENESIS — LUMINA OS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230070ba'/><text x='16' y='23' font-family='system-ui,sans-serif' font-size='20' font-weight='800' fill='white' text-anchor='middle'>G</text></svg>">
  <link rel="stylesheet" href="/style.css?v=20261112-final6">
  <script src="/ag-studio.min.js"></script>
</head>
<body class="lumina-body">
  <div id="desktopApp" class="lumina-shell">
    <!-- LUMINA Contextual Top Bar -->
    <header id="appHeader" class="lumina-topbar">
      <div class="topbar-left">
        <a class="lumina-brand" href="#/intro" id="brandHomeLink" aria-label="PayPal GENESIS Home">
          <div class="paypal-glyph">
            <svg viewBox="0 0 28 32" fill="none" class="paypal-svg">
              <path d="M4 2 L16 2 C21 2, 24 4.5, 24 8 C24 11.5, 21 14, 16 14 L10 14 L7 28 L3 28 L4 2 Z" fill="#e0f2fe"/>
              <path d="M8 5 L19 5 C23 5, 26 7.5, 26 11 C26 14.5, 23 17, 18 17 L13 17 L10 30 L6 30 L8 5 Z" fill="#2589ff" opacity="0.92"/>
            </svg>
          </div>
          <div class="lumina-brand-meta">
            <span class="lumina-brand-sub">PayPal</span>
            <span class="lumina-brand-title">GENESIS</span>
          </div>
        </a>

        <div class="topbar-sep" aria-hidden="true"></div>

        <div class="window-title-group" id="windowTitleGroup">
          <span class="window-kicker" id="windowKicker">PRODUCT OS</span>
          <span class="window-sep">/</span>
          <h1 id="heading" class="window-title">Home</h1>
        </div>
      </div>

      <!-- Quick Role & Demo Switcher in Center -->
      <div class="topbar-center">
        <div class="lumina-role-pill" id="rolePill">
          <button type="button" class="role-btn" id="btnRoleConsumer" title="Switch to Consumer Perspective">
            <svg viewBox="0 0 24 24" class="icon" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M6 21v-2a4 4 0 0 1 8 0v2"/></svg>
            <span>Consumer</span>
          </button>
          <button type="button" class="role-btn" id="btnRoleMaker" title="Switch to Manufacturer Perspective">
            <svg viewBox="0 0 24 24" class="icon" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M3 7v14M21 7v14M6 7l6-4 6 4"/></svg>
            <span>Manufacturer</span>
          </button>
        </div>
      </div>

      <div class="topbar-right">
        <button type="button" class="lumina-icon-btn" id="headerHelpBtn" title="How GENESIS Works" aria-label="Help">
          <svg viewBox="0 0 24 24" class="icon" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </button>

        <div id="account"></div>
      </div>
    </header>

    <!-- System Notice & Banner Slots -->
    <div id="bannerSlot"></div>
    <div id="notice" role="status" aria-live="polite" tabindex="-1"></div>

    <!-- Main Dynamic Canvas -->
    <main id="mainCanvas">
      <section id="view" class="lumina-view-canvas"></section>
    </main>

    <!-- Floating LUMINA Navigation Dock -->
    <nav id="luminaDock" class="lumina-dock" aria-label="Application Dock">
      <div id="nav" class="dock-items"></div>
    </nav>
  </div>

  <dialog id="modal" aria-labelledby="modalTitle">
    <button class="close" id="modalClose" type="button" aria-label="Close">×</button>
    <div id="modalNotice" role="alert" aria-live="polite"></div>
    <div id="modalBody"></div>
  </dialog>

  <script type="module" src="/app.js?v=20261112-final6"></script>
</body>
</html>
